# dsh-notion bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with:
# `dsh plugin --profile web add github:zhengjy01/dsh-notion-connector`
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (Notion API client, /api/dsh-notion routes, agent tools),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: notion
      name: 'dsh-notion-connector'
